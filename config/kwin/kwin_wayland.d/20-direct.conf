[Service]
Type=simple
ExecStart=
ExecStartPre=/usr/local/bin/kwin-wait-gpu.sh
# environment.d exports WAYLAND_DISPLAY/DISPLAY to the user manager for
# clients; kwin auto-detects a nested backend from them, so strip them
# for the compositor itself.
UnsetEnvironment=WAYLAND_DISPLAY DISPLAY
ExecStart=/usr/bin/kwin_wayland --no-lockscreen --xwayland
